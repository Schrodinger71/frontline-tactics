schema: spec-driven

# Контекст проекта: подставляется во все артефакты OpenSpec и читается агентом
# в начале работы ВМЕСТО обхода кода. Держать коротким и верным.
context: |
  Frontline Tactics — пошаговая штабная игра на гексах (браузер + сервер Node 18+, зависимость одна: ws).
  Язык кода, комментариев, интерфейса, журнала и спецификаций — русский.

  Запуск и проверка:
    npm start            сервер (PORT, по умолчанию 8082)
    npm test             сверка версии + test/headless.js (правила, партии ботов) + test/e2e.js (сервер по WebSocket)
  Версия — только в package.json (scripts/sync-version.js разносит в shared/world.js и README). Агент версию не поднимает.

  Где что лежит (читать нужный файл, а не весь проект):
    shared/world.js      таблицы: UT (типы частей), FACTIONS, SPECS (специалисты), SUPPLY, CP, FOB, AIR, ORDERS, экономика, лимиты
    shared/rules.js      чистые правила, общие для сервера и клиента: stepCost/reachable (движение, зоны контроля),
                         odds (бой), bombardOdds/firePow (огонь), airCover/airOdds/aaZone (авиация и ПВО), effStr
    shared/hex.js        сетка гексов под размер карты (gridFor), рёбра: река RIV, мост BR, дорога RD
    shared/maps.js       карты: размеры, точки, дороги, реки, зоны расстановки, погода карты
    shared/terrain.js    местность и геометрия дорог/рек; shared/weather.js — таблица погоды; shared/icons.js — силуэты техники
    game/engine.js       Game: расстановка, ход стороны, движение, бой, огонь, авиация, приказы, снабжение,
                         территория, командные пункты, специалисты, победа
    game/ai.js           бот (примесь к Game); game/scenarios.js — сценарии кампании; game/views.js — снимок «глазами стороны»
    game/save.js         сохранение и загрузка партии с проверкой снимка
    server/index.js      HTTP-статика и WebSocket-протокол; server/room.js — комната: места, хозяин, список партий
    client/js/main.js    состояние G, сеть, панели, меню, ввод; client/js/map.js — кадр карты и оверлеи
    client/js/view.js    камера; client/js/render/*.js — подложка, фишки, эффекты, погода; client/js/icons.js — отрисовка иконок
    client/js/news.js    журнал изменений NEWS (экран «Что нового»); client/js/sound.js — звук и музыка
    client/css/style.css, hud.css — стили (hud.css грузится позже и перекрывает)
    test/headless.js, test/e2e.js — тесты

  Обязательные правила работы:
    - Каждое заметное игроку изменение — в NEWS (client/js/news.js), в запись с v = текущей версии; цифры «было → стало».
    - Поведение описано в openspec/specs/<область>/spec.md. Меняешь поведение — в том же заходе правишь спецификацию.
    - Числа баланса живут в shared/world.js; в спецификациях их не дублировать без нужды — ссылаться на константу.
    - Правило, нужное и серверу, и клиенту (расчёт, предпросмотр), — в shared/rules.js, а не копией в клиенте.
    - Клиент не доверяет себе: сервер проверяет каждое действие (Game.act). Ввод клиента — недоверенный.
    - После правок — npm test; интерфейс проверять в браузере.

  Области без спецификации (читать код): отрисовка карты и эффектов (client/js/render), звук, бот (game/ai.js),
  подробности сценариев (game/scenarios.js), вёрстка панелей.

rules:
  proposal:
    - Коротко — зачем и что меняется для игрока; назвать затронутые области из openspec/specs.
    - Назвать файлы и функции, которые будут правиться.
  specs:
    - Заголовки по формату OpenSpec; текст по-русски, ключевые слова SHALL/MUST и GIVEN/WHEN/THEN — латиницей.
    - Требование — про поведение; после него строка «Код:» с файлом и функцией. Числа — ссылкой на константу.
    - Не больше одного-двух сценариев на требование.
  tasks:
    - Последние пункты всегда — тест (npm test), запись в NEWS, правка основной спецификации.
